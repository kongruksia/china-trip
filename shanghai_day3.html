<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --cream: #FDF6EC;
  --cream2: #F5E9D0;

  --gold2: #E8C96C;
  --gold-pale: #FEF3DC;
  --coral: #D96E4A;
  --coral2: #F2AA85;
  --brown: #4A2C1A;

  --text: #2C1810;

  --white: #FFFFFF;

}
body { font-family:'Noto Sans Thai','Inter',sans-serif; background:var(--cream); color:var(--text); max-width:820px; margin:0 auto; padding-bottom:70px; }

/* â•â• HERO â•â• */
.hero { position:relative; height:460px; overflow:hidden; background:linear-gradient(135deg,#0d2535,#1a4a5a,#0a2030); }
.hero img { width:100%; height:100%; object-fit:cover; display:block; opacity:0.88; }
.hero-overlay { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(5,15,25,0.08) 0%,rgba(5,15,25,0.38) 55%,rgba(5,15,25,0.88) 100%); }
.hero-content { position:absolute; bottom:38px; left:38px; right:38px; }
.day-pill { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#1E88E5,#1255AA); color:white; font-size:11px; font-weight:800; letter-spacing:3px; text-transform:uppercase; padding:8px 22px; border-radius:30px; margin-bottom:14px; box-shadow:0 5px 18px rgba(30,100,200,0.55); }
.date-tag { position:absolute; top:28px; right:38px; background:rgba(255,255,255,0.15); backdrop-filter:blur(10px); color:white; font-size:13px; font-weight:500; padding:8px 18px; border-radius:22px; border:1px solid rgba(255,255,255,0.28); }
.hero-title { font-family:'Playfair Display',serif; font-size:50px; font-weight:900; color:white; line-height:1.05; text-shadow:0 4px 20px rgba(0,0,0,0.6); }
.hero-sub { color:rgba(255,255,255,0.78); font-size:15px; font-weight:400; margin-top:10px; letter-spacing:3px; text-transform:uppercase; }

/* â•â• NAV BAR â•â• */
.day-nav { background:var(--brown); padding:14px 28px; display:flex; justify-content:space-between; align-items:center; }
.day-nav a { color:var(--gold2); text-decoration:none; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; }
.day-nav .center { color:rgba(255,255,255,0.45); font-size:12px; letter-spacing:2px; }

/* â•â• CONTENT â•â• */
.content { padding:36px 30px; }

/* â•â• SUMMARY BOX â•â• */
.summary-box { background:linear-gradient(135deg,var(--gold-pale),#FFFCF5); border:1.5px solid var(--gold2); border-radius:20px; padding:22px 26px; margin-bottom:38px; display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
.sum-item { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--brown2); font-weight:500; }
.sum-icon { font-size:20px; }

/* â•â• SECTION HEADER â•â• */
.sec-head { font-size:10px; font-weight:800; letter-spacing:4px; color:var(--coral); text-transform:uppercase; margin-bottom:24px; display:flex; align-items:center; gap:12px; }
.sec-head::after { content:''; flex:1; height:1px; background:var(--coral2); opacity:0.35; }

/* â•â• DAY TRIP BANNER â•â• */
.daytrip-banner { background:linear-gradient(135deg,#E3F2FD,#BBDEFB); border:2px solid #90CAF9; border-radius:18px; padding:20px 24px; margin-bottom:30px; display:flex; align-items:center; gap:16px; }
.daytrip-icon { font-size:40px; flex-shrink:0; }
.daytrip-content { flex:1; }
.daytrip-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:#0D47A1; margin-bottom:6px; }
.daytrip-desc { font-size:14px; color:#1565C0; line-height:1.6; }

/* â•â• STOP CARDS â•â• */
.stop { background:var(--white); border-radius:24px; box-shadow:var(--shadow); margin-bottom:30px; overflow:hidden; transition:box-shadow 0.3s,transform 0.3s; }
.stop:hover { box-shadow:var(--shadow2); transform:translateY(-3px); }
.stop-top { padding:24px 24px 0 24px; display:flex; gap:18px; align-items:flex-start; }
.num-circle { width:48px; height:48px; flex-shrink:0; background:linear-gradient(135deg,#D4A030,#9E6E18); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:22px; font-weight:800; box-shadow:0 5px 16px rgba(180,130,40,0.45); margin-top:2px; font-family:'Playfair Display',serif; }
.stop-meta { flex:1; }
.stop-time { font-size:11px; font-weight:700; color:var(--brown2); letter-spacing:1.5px; margin-bottom:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.stop-name { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1.12; margin-bottom:4px; }
.stop-name-th { font-size:14px; color:var(--brown2); font-weight:400; }
.stop-img { width:100%; height:240px; object-fit:cover; display:block; margin-top:18px; }
.stop-img-placeholder { width:100%; height:240px; display:flex; align-items:center; justify-content:center; font-size:80px; margin-top:18px; }
.stop-body { padding:20px 24px 24px 24px; }
.th-label { font-size:11px; font-weight:800; color:var(--coral); letter-spacing:1px; text-transform:uppercase; margin-top:16px; margin-bottom:8px; display:block; }
.stop-desc { font-size:14.5px; line-height:1.78; color:var(--text2); }

.transport-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.pill { display:inline-flex; align-items:center; gap:5px; padding:6px 14px; border-radius:22px; font-size:11px; font-weight:700; }
.pill-walk { background:var(--cream2); color:var(--brown2); border:1px solid #D4B98A; }
.pill-taxi { background:#FFF9E0; color:#8B6500; border:1px solid #F0D060; }
.pill-bus { background:#E8F5E9; color:#2E7D32; border:1px solid #A5D6A7; }
.l2 { background:#007A3D; color:white; }
.l9 { background:#009A97; color:white; }
.l10 { background:#8E44AD; color:white; }
.l13 { background:#D35400; color:white; }
.l17 { background:#922B21; color:white; }

/* â•â• HIGHLIGHT BOX â•â• */

.highlight strong { color:#A07020; }
.highlight-blue { background:linear-gradient(135deg,#E8F4FF,#DBEEFF); border:1.5px solid #90CAF9; border-radius:14px; padding:14px 18px; margin-top:14px; font-size:14px; line-height:1.68; color:#1A3F6A; }
.highlight-blue strong { color:#0D47A1; }
